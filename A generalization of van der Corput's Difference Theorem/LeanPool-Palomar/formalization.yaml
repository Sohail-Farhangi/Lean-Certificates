      lean: VdC.Submission.spectral_difference
      module: Palomar.Solution
      status: proved
    - source: Theorem 3.3
      lean: VdC.Submission.weak_mixing_difference
      module: Palomar.Solution
      status: proved
    - source: Theorem 3.5
      lean: VdC.Submission.orthogonality_lag_pairs
      module: Palomar.Solution
      status: proved
